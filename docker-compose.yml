# -----------------------------------------------------------------------------
# Local environment.
#   docker compose up -d                 -> PostgreSQL only (run API + web from your IDE)
#   docker compose --profile full up -d  -> PostgreSQL + API + web, everything in containers
# Web: http://localhost:3000   API/Swagger: http://localhost:5080/swagger
# -----------------------------------------------------------------------------
name: iplstore

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iplstore
      POSTGRES_USER: ipl
      POSTGRES_PASSWORD: ipl_local_only
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipl -d iplstore"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: "Host=postgres;Port=5432;Database=iplstore;Username=ipl;Password=ipl_local_only"
      Database__SeedDemoData: "true"
      Swagger__Enabled: "true"
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
